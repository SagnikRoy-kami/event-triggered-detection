[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etod"
version = "1.0.0"
description = "Event-triggered object detection: run the expensive detector only when the scene changes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3", "opencv-python>=4.8", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7",
  "pyyaml>=6.0", "jinja2>=3.1", "tqdm>=4.65", "psutil>=5.9",
]

[project.optional-dependencies]
data = ["kaggle>=1.6"]
dev = ["pytest>=7.4"]
gpu = ["nvidia-ml-py>=12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"etod.reporting" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
